# Self-hosted ntfy on a Raspberry Pi 5, reachable only through a Cloudflare Tunnel.
#
# No ports are published anywhere. cloudflared dials out to Cloudflare, so the Pi
# exposes nothing on the LAN or the internet. Both services sit on the default
# compose network, which is how cloudflared reaches ntfy at http://ntfy:80.
#
# In Cloudflare Zero Trust the tunnel Public Hostname must be:
#   subdomain: ntfy        domain: your domain
#   service:   HTTP        URL:    ntfy:80
# Use "ntfy:80" (the compose service name and container port), never localhost,
# 127.0.0.1 or a host port: those resolve inside the cloudflared container.

services:
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_BEHIND_PROXY: "true"
      NTFY_LISTEN_HTTP: ":80"
    volumes:
      # ntfy runs as uid 1000; the host folder must be writable by that user.
      # See README: sudo chown -R 1000:1000 data
      - ./data:/var/lib/ntfy

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - ntfy
