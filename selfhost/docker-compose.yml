# Self-hosted ntfy on a Raspberry Pi 5.
#
# ntfy is published on 127.0.0.1 only: cloudflared runs on the host (as a
# systemd service) and reaches it there. Nothing is exposed on the LAN.
#
# The Cloudflare Tunnel is created with the cloudflared CLI, not the Zero Trust
# dashboard, so this setup needs no Zero Trust plan:
#   cloudflared tunnel login
#   cloudflared tunnel create ntfy
#   cloudflared tunnel route dns ntfy ntfy.yourdomain.com
# See README.md for the full runbook.

services:
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_BEHIND_PROXY: "true"
      NTFY_LISTEN_HTTP: ":80"
    volumes:
      # ntfy runs as uid 1000; the host folder must be writable by that user.
      # See README: sudo chown -R 1000:1000 data
      - ./data:/var/lib/ntfy
    ports:
      # Loopback only. cloudflared lives on the host and connects here.
      - "127.0.0.1:2586:80"
