# Self-hosted ntfy on a Raspberry Pi 5.
#
# ntfy is published on 127.0.0.1 only. cloudflared runs on the HOST as a systemd
# service, so it can reach this port and any other service you add later.
# Nothing is exposed on the LAN.
#
# Create the tunnel in the Cloudflare dashboard (Zero Trust → Networks →
# Tunnels), add a public hostname pointing at http://127.0.0.1:2586, then run:
#   sudo cloudflared service install <TOKEN>
# See README.md for the full runbook.

services:
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_BEHIND_PROXY: "true"
      NTFY_LISTEN_HTTP: ":80"
    volumes:
      # ntfy runs as uid 1000; the host folder must be writable by that user.
      # See README: sudo chown -R 1000:1000 data
      - ./data:/var/lib/ntfy
    ports:
      # Loopback only. cloudflared on the host connects here.
      - "127.0.0.1:2586:80"
